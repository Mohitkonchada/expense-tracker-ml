<!DOCTYPE html>
<html>

<head>
    <title>Expense Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #1e90ff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 450px;
            padding: 25px;

            box-shadow: 0px 0px 12px rgba(0,0,0,0.3);

            margin-top: 30px;

            max-height: 90vh;
            overflow-y: auto;

            border-radius: 0px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        h3 {
            text-align: center;
        }

        input {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid gray;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background-color: #1e90ff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0d74d1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th {
            background-color: #1e90ff;
            color: white;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: red;
            font-weight: bold;
        }

        hr {
            margin-top: 25px;
            margin-bottom: 25px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>
        Welcome {{ current_user.username }}
    </h2>

    <form method="POST">

        <input
            type="number"
            step="0.01"
            name="amount"
            placeholder="Enter Amount"
            required
        >

        <input
            type="text"
            name="category"
            placeholder="Enter Category"
            required
        >

        <button type="submit">
            Add Expense
        </button>

    </form>

    <hr>

    <h3>Your Expenses</h3>

    {% if expenses %}

    <table>

        <tr>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
        </tr>

        {% for expense in expenses %}

        <tr>
            <td>₹ {{ expense[0] }}</td>
            <td>{{ expense[1] }}</td>
            <td>{{ expense[2] }}</td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

        <p style="text-align:center;">
            No expenses added yet.
        </p>

    {% endif %}

    <a href="/logout">
        Logout
    </a>

</div>

</body>

</html>
